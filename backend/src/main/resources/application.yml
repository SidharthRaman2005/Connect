spring:
  application:
    name: connect-backend

  # --- Database connection ---
  # Values are read from the environment (see backend/.env, which is loaded
  # automatically by spring-dotenv). Never hardcode credentials here.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/connect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: connect-pool
      maximum-pool-size: 10

  jpa:
    hibernate:
      # Dev convenience: Hibernate creates/updates tables from entities.
      # Replace with Flyway migrations + 'validate' before any real deployment.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: false

server:
  port: 8080

app:
  # CORS origins allowed to call the API (the Vite dev server by default).
  # Override per environment with the APP_CORS_ALLOWED_ORIGINS env var.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Authentication settings. The Google OAuth client ID is the token audience
  # the backend accepts; it must match the one the frontend signs in with.
  auth:
    google-client-id: ${GOOGLE_CLIENT_ID:504517063945-pno4gnbnrtf74av9409tvi1am8vglt7t.apps.googleusercontent.com}
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:vitapstudent.ac.in}
    # HMAC secret for signing session JWTs. If blank, an ephemeral key is
    # generated at startup (fine for dev, but sessions reset on restart).
    # Set JWT_SECRET (>= 32 chars) in backend/.env for stable sessions.
    jwt-secret: ${JWT_SECRET:}
    jwt-expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}

# Expose a minimal set of actuator endpoints; health is handy for probes.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
